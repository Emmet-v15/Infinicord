name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build and package
        run: bun package

      - name: Generate JSON manifest
        run: node scripts/build/genManifest.mjs

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('dist/infinicord.json', 'utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Infinicord ${{ steps.version.outputs.version }}
          body: Automated build from commit ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/infinicord.exe
            dist/infinicord.exe.blockmap
            dist/latest.yml
            dist/infinicord.json
