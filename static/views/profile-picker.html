<!doctype html>
<meta charset="utf-8" />

<head>
    <title>Infinicord</title>

    <link rel="stylesheet" href="./common.css" type="text/css" />
    <link rel="stylesheet" href="./brand.generated.css" type="text/css" />

    <style>
        body {
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 20px 32px;
            background:
                radial-gradient(900px 420px at 50% -8%, color-mix(in srgb, var(--infinicord-primary) 16%, transparent), transparent 70%),
                var(--bg);
            user-select: none;
            overflow: hidden;
        }

        #drag {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 20%;
            -webkit-app-region: drag;
            z-index: 10;
        }

        /* Chromium only honors no-drag reliably as a descendant of the drag
           region — this invisible hole, aligned over the × (body padding
           20px/32px, button 34px), keeps the close button clickable */
        #drag-close-hole {
            position: absolute;
            top: 20px;
            right: 32px;
            width: 34px;
            height: 34px;
            -webkit-app-region: no-drag;
        }

        #top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #brand img {
            width: 34px;
            height: 34px;
        }

        #brand span {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.35em;
            color: var(--fg);
        }

        #close {
            position: relative;
            z-index: 11;
            -webkit-app-region: no-drag;
            width: 34px;
            height: 34px;
            padding: 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--fg-secondary);
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            transition: 150ms background;
        }

        #close:hover {
            background: color-mix(in srgb, var(--fg) 12%, transparent);
            color: var(--fg);
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
        }

        #tiles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 22px;
            max-width: 100%;
        }

        .tile-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .tile {
            box-sizing: border-box;
            width: 96px;
            height: 96px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            background: color-mix(in srgb, var(--fg) 7%, transparent);
            border: 2px solid transparent;
            cursor: pointer;
            transition: 150ms border-color, 150ms box-shadow, 150ms filter;
        }

        .tile:hover {
            border-color: color-mix(in srgb, var(--infinicord-primary) 55%, transparent);
            filter: brightness(1.25);
        }

        .tile.selected {
            border-color: var(--infinicord-primary);
            box-shadow: 0 0 14px color-mix(in srgb, var(--infinicord-primary) 45%, transparent);
        }

        .tile img {
            width: 52px;
            height: 52px;
        }

        .tile .num {
            font-size: 34px;
            font-weight: 700;
            background: var(--infinicord-gradient-logo-fill);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tile.add {
            background: transparent;
            border: 1px dashed var(--fg-semi-trans);
            color: var(--fg);
            font-size: 40px;
            font-weight: 300;
        }

        .tile-wrap small {
            font-size: 12px;
            color: var(--fg-secondary);
        }

        /* hover-revealed delete button on numbered profile tiles */
        .tile-del {
            position: absolute;
            top: -7px;
            right: -7px;
            z-index: 2;
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fg-secondary);
            color: var(--bg);
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.7);
            transition: 120ms opacity, 120ms transform, 150ms background;
        }

        .tile-wrap:hover .tile-del {
            opacity: 1;
            transform: scale(1);
        }

        .tile-del:hover {
            background: #d83c3e;
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        #modal {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgb(0 0 0 / 0.55);
        }

        #modal-card {
            box-sizing: border-box;
            width: 380px;
            max-width: calc(100vw - 48px);
            padding: 20px 22px;
            border-radius: 10px;
            background: var(--bg);
            box-shadow: 0 18px 50px rgb(0 0 0 / 0.45);
        }

        #modal-card h2 {
            margin: 0 0 8px;
            font-size: 17px;
        }

        #modal-card p {
            margin: 0;
            font-size: 13px;
            line-height: 1.45;
            color: var(--fg-secondary);
        }

        #modal-error {
            margin-top: 8px;
            color: #fa777c;
        }

        #modal-error.empty {
            display: none;
        }

        #modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        #modal-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 150ms background;
        }

        #modal-cancel {
            background: color-mix(in srgb, var(--fg) 10%, transparent);
            color: var(--fg);
        }

        #modal-cancel:hover {
            background: color-mix(in srgb, var(--fg) 16%, transparent);
        }

        #modal-delete {
            background: #d83c3e;
            color: #fff;
        }

        #modal-delete:hover {
            background: #a12d31;
        }

        #modal-delete:disabled {
            opacity: 0.6;
            cursor: default;
        }
    </style>
</head>

<body>
    <div id="drag"><div id="drag-close-hole"></div></div>
    <div id="top">
        <div id="brand">
            <img draggable="false" src="./brand-splash.svg" alt="" />
            <span>INFINICORD</span>
        </div>
        <button id="close" title="Quit">&#10005;</button>
    </div>

    <div id="main">
        <h1>Who's chatting?</h1>
        <div id="tiles"></div>
    </div>

    <div id="modal" class="hidden">
        <div id="modal-card">
            <h2 id="modal-title">Delete profile?</h2>
            <p id="modal-body"></p>
            <p id="modal-error" class="empty"></p>
            <div id="modal-actions">
                <button id="modal-cancel" type="button">Cancel</button>
                <button id="modal-delete" type="button">Delete</button>
            </div>
        </div>
    </div>
</body>

<script>
    const params = new URLSearchParams(location.search);
    const profiles = (params.get("profiles") ?? "")
        .split(",")
        .map(Number)
        .filter(n => Number.isInteger(n) && n >= 1);
    const canAdd = params.get("canAdd") === "1";
    const last = params.get("last") ?? "default";

    const tiles = document.getElementById("tiles");

    function addTile({ value, caption, content }) {
        const wrap = document.createElement("div");
        wrap.className = "tile-wrap";

        const tile = document.createElement("div");
        tile.className = "tile" + (value === last ? " selected" : "");
        tile.appendChild(content);
        tile.onclick = () => console.info("picked:" + value);
        wrap.appendChild(tile);

        const label = document.createElement("small");
        label.textContent = caption;
        wrap.appendChild(label);

        tiles.appendChild(wrap);
    }

    // Default tile — brand glyph
    {
        const img = document.createElement("img");
        img.draggable = false;
        img.src = "./brand-splash.svg";
        img.alt = "";
        addTile({ value: "default", caption: "Default", content: img });
    }

    // Numbered profile tiles
    for (const n of profiles) {
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = String(n);
        addTile({ value: String(n), caption: `Profile ${n}`, content: num });

        // hover-revealed delete button — never on Default or Add
        const wrap = tiles.lastElementChild;
        const del = document.createElement("button");
        del.type = "button";
        del.className = "tile-del";
        del.title = `Delete profile ${n}`;
        del.textContent = "✕";
        del.onclick = () => openDeleteModal(n);
        wrap.appendChild(del);
    }

    // Add-new tile
    if (canAdd) {
        const plus = document.createElement("span");
        plus.textContent = "+";
        addTile({ value: "add", caption: "Add profile", content: plus });
        const addTileEl = tiles.lastElementChild.querySelector(".tile");
        addTileEl.classList.add("add");
        addTileEl.onclick = () => console.info("addnew");
    }

    // NB: bare `close` would resolve to window.close, not this button
    document.getElementById("close").onclick = () => console.info("cancel");

    // ---- delete confirmation modal ----
    const modalEl = document.getElementById("modal");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");
    const modalError = document.getElementById("modal-error");
    const modalCancel = document.getElementById("modal-cancel");
    const modalDelete = document.getElementById("modal-delete");
    const dragEl = document.getElementById("drag");

    let deleteTarget = null; // profile number the modal is open for
    let deleteBusy = false;

    function openDeleteModal(n) {
        deleteTarget = n;
        deleteBusy = false;
        modalTitle.textContent = `Delete profile ${n}?`;
        modalBody.textContent =
            "This permanently deletes Profile " +
            n +
            "'s data — its Discord sign-in, settings and caches. This cannot be undone.";
        modalError.textContent = "";
        modalError.classList.add("empty");
        modalDelete.disabled = false;
        modalDelete.textContent = "Delete";
        // the modal owns the whole window: dragging would eat clicks in the
        // top strip behind the backdrop (no-drag needs a drag ancestor)
        dragEl.style.display = "none";
        modalEl.classList.remove("hidden");
        modalCancel.focus();
    }

    function closeDeleteModal() {
        if (deleteBusy) return;
        deleteTarget = null;
        modalEl.classList.add("hidden");
        dragEl.style.display = "";
    }

    // main process reports a failed delete back (success reloads the page)
    window.__deleteResult = res => {
        deleteBusy = false;
        modalDelete.disabled = false;
        modalDelete.textContent = "Delete";
        modalError.textContent = (res && res.error) || "Something went wrong";
        modalError.classList.remove("empty");
    };

    modalCancel.onclick = closeDeleteModal;
    modalEl.onclick = e => {
        if (e.target === modalEl) closeDeleteModal();
    };
    modalDelete.onclick = () => {
        if (deleteTarget == null || deleteBusy) return;
        deleteBusy = true;
        modalDelete.disabled = true;
        modalDelete.textContent = "Deleting…";
        console.info("delete:" + deleteTarget);
    };

    document.addEventListener("keydown", e => {
        if (deleteTarget != null) {
            // while deleting, Escape/Enter must never reach the app-quit path
            if (!deleteBusy && (e.key === "Escape" || e.key === "Enter")) closeDeleteModal();
            return;
        }
        if (e.key === "Escape") console.info("cancel");
        if (e.key === "Enter") {
            const selected = tiles.querySelector(".tile.selected");
            if (selected) selected.click();
        }
    });
</script>
